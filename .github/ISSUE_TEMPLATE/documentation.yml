name: Documentation improvement
description: Report unclear, missing, inconsistent, or outdated documentation.
title: "docs: "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link or path to the affected documentation.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain what is unclear, missing, inconsistent, or incorrect.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Suggested change
      description: Describe the information or example that would resolve the problem.
    validations:
      required: true
