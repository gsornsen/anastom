name: DCO

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while IFS= read -r commit; do
            if ! git show --no-patch --format=%B "$commit" | grep -qiE '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a DCO Signed-off-by line."
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")
          exit "$missing"
