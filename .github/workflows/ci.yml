name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, types, lint, and demo
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Check package documentation and release plans
        run: pnpm hygiene

      - name: Validate demo workflow
        run: pnpm anastom validate examples/workflows/demo-feature.yaml

      - name: Execute fake demo
        run: pnpm anastom run examples/workflows/demo-feature.yaml --fake-scenario examples/fake/success.yaml

  macos:
    name: macOS filesystem and process portability
    runs-on: macos-15
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm and Node.js
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify filesystem and process portability
        run: pnpm test packages/workspaces packages/persistence packages/engine/src/command.test.ts packages/cli/src/durable.test.ts packages/runtime-codex/src/profile.test.ts packages/runtime-codex/src/process.test.ts packages/runtime-claude-code/src/process.test.ts scripts/probe-m3-process-ownership.test.ts scripts/probe-m3-supervisor-protocol.test.ts
